  "articleBody": "The city council voted on Tuesday to approve twelve kilometres of protected bike lanes across the downtown core, ending a two-year debate over street space.\n\nConstruction is scheduled to begin in the autumn and finish within eighteen months. The plan removes about four hundred parking spaces, which business groups had opposed during public consultations.\n\nSupporters argued that the lanes would reduce traffic injuries and make cycling a realistic option for commuters who currently drive short distances to work."
