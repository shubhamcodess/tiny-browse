name: Release

# Releases on merge to main, driven by the version in package.json:
#  1. If tag v<version> does not exist yet: run every check, build the tarball,
#     create the tag, and create a GitHub release with the tarball attached and
#     generated notes (a version like 1.0.0-beta.1 becomes a pre-release).
#  2. If that version is not on npm yet and the NPM_TOKEN secret exists: publish
#     the same tarball to npm with provenance (dist-tag "next" for pre-releases),
#     then install it from the registry and run it.
# Merging without bumping the version does nothing. A failed npm step is
# retried by re-running the workflow (or the next merge): the tag and release
# are not created twice.
#
# One-time setup:
#  - npm: create a granular access token with read and write access (bypass 2FA)
#    and save it as the repository secret NPM_TOKEN. Without it, steps 1 runs and
#    step 2 logs a notice.
#  - Settings -> Actions -> General -> Workflow permissions: "Read and write".
#
# Run it by hand from the Actions tab for a dry run (checks + npm publish --dry-run, no tag).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: run every check and npm publish --dry-run; create and publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: What to release
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      tag_exists: ${{ steps.state.outputs.tag_exists }}
      on_npm: ${{ steps.state.outputs.on_npm }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: meta
        run: |
          V="$(node -p "require('./package.json').version")"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          case "$V" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
          echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" >> "$GITHUB_OUTPUT"
      - id: state
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.meta.outputs.tag }}" >/dev/null; then echo "tag_exists=true" >> "$GITHUB_OUTPUT"; else echo "tag_exists=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$(npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version 2>/dev/null || true)" = "${{ steps.meta.outputs.version }}" ]; then echo "on_npm=true" >> "$GITHUB_OUTPUT"; else echo "on_npm=false" >> "$GITHUB_OUTPUT"; fi
      - name: Summary
        run: |
          echo "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.tag }}: tag exists=${{ steps.state.outputs.tag_exists }}, on npm=${{ steps.state.outputs.on_npm }}, dry run=${{ steps.meta.outputs.dry_run }}" | tee -a "$GITHUB_STEP_SUMMARY"

  verify:
    name: Checks and tarball
    needs: plan
    if: needs.plan.outputs.tag_exists != 'true' || needs.plan.outputs.on_npm != 'true' || needs.plan.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: "*.tgz"
          if-no-files-found: error

  github-release:
    name: Tag and GitHub release
    needs: [plan, verify]
    if: needs.plan.outputs.tag_exists != 'true' && needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: Create the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.plan.outputs.tag }}" -m "${{ needs.plan.outputs.name }} ${{ needs.plan.outputs.version }}" "$GITHUB_SHA"
          git push origin "${{ needs.plan.outputs.tag }}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRE=""; [ "${{ needs.plan.outputs.prerelease }}" = "true" ] && PRE="--prerelease"
          # Also attach a copy with a fixed name, so the latest release installs from one URL:
          # npm install -g https://github.com/shubhamcodess/tiny-browse/releases/latest/download/tiny-browse.tgz
          VERSIONED="$(ls ./*.tgz)"
          cp "$VERSIONED" tiny-browse.tgz
          gh release create "${{ needs.plan.outputs.tag }}" "$VERSIONED" tiny-browse.tgz \
            --title "${{ needs.plan.outputs.name }} ${{ needs.plan.outputs.version }}" \
            --generate-notes --verify-tag $PRE

  npm:
    name: Publish to npm
    needs: [plan, verify, github-release]
    # After the GitHub release, or without it when the tag already existed (re-run after an npm failure).
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.github-release.result == 'success' || needs.github-release.result == 'skipped') &&
      (needs.plan.outputs.on_npm != 'true' || needs.plan.outputs.dry_run == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: Publish the tarball
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TARBALL="$(ls ./*.tgz)"
          DIST_TAG=latest; [ "${{ needs.plan.outputs.prerelease }}" = "true" ] && DIST_TAG=next
          if [ "${{ needs.plan.outputs.dry_run }}" = "true" ]; then
            npm publish "$TARBALL" --dry-run --access public --tag "$DIST_TAG"
            exit 0
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::NPM_TOKEN is not set: the GitHub release is done, npm was skipped. Add the secret and re-run this workflow to publish."
            exit 0
          fi
          npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG"
          echo "published=true" >> "$GITHUB_OUTPUT"

  verify-registry:
    name: Install from npm and run it
    needs: [plan, npm]
    if: needs.npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the published version and run it
        run: |
          set -euo pipefail
          SPEC="${{ needs.plan.outputs.name }}@${{ needs.plan.outputs.version }}"
          for i in $(seq 1 10); do npm view "$SPEC" version >/dev/null 2>&1 && break; echo "waiting for the registry ($i)"; sleep 15; done
          D="$(mktemp -d)"; cd "$D"
          echo '{"name":"consumer","private":true,"type":"module"}' > package.json
          npm install "$SPEC" --no-audit --no-fund
          npx --no-install tiny-browse --version | grep -qx "${{ needs.plan.outputs.version }}"
          node --input-type=module -e 'const m = await import("@shubhamcodess/tiny-browse"); console.log("library ok", m.VERSION);'
          npm audit signatures
