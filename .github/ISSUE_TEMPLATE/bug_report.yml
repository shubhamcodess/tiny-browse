name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command, tool call or code, and the URL or query if it's public.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `tiny-browse doctor`
      render: text
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: How you use it
      placeholder: "e.g. Claude Code over stdio, VS Code Copilot over HTTP, library in a Node app"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `--log-level debug` and paste the relevant lines. Remove anything private.
      render: text
