version: 2
updates:
  # Keeps workflow actions current (the package itself has no runtime dependencies).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Major upgrades of the build toolchain need manual work (tsup 9 + TypeScript 7 can't emit .d.ts yet).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tsup
        update-types: ["version-update:semver-major"]
